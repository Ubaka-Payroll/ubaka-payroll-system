services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ubaka_attendance}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./database:/docker-entrypoint-initdb.d/sql:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ubaka_attendance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ubaka_attendance}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@ubaka.com}
      SEED_PORTAL: ${SEED_PORTAL:-false}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      DOCKER_PROXY_URL: http://docker-proxy:2375
      HOST_PROC_PATH: /hostfs/proc
      HOST_ROOT_PATH: /hostfs
      REDIS_URL: ${REDIS_URL:-}
      SYSTEM_METRICS_RETENTION_DAYS: ${SYSTEM_METRICS_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - backend_logs:/app/logs
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro

  # Read-only, locked-down Docker API access for container metrics. The backend
  # never touches /var/run/docker.sock directly — only this proxy does, and only
  # for the minimal surface needed (list/inspect/stats/info). No exec/start/stop/
  # build/network/volume access, and no host port is published.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      IMAGES: 1
      POST: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  backend_logs:
